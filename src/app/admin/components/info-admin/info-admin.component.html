<ng-container *ngIf="piso && aparatos; else elseTemplate">

  <mat-tab-group class="w-full">

    <mat-tab label="Piso">
      <div class="p-5">


        <button mat-raised-button color="accent" class="w-full m-3 p-3" (click)="setPiso()">Guardar Cambios</button>

        <h4>Sobre el piso</h4>

        <mat-form-field class="w-full">
          <mat-label>Descripcion</mat-label>
          <textarea cdkTextareaAutosize cdkAutosizeMinRows="1" cdkAutosizeMaxRows="5" required matInput
            [(ngModel)]="piso.descripcion"></textarea>
        </mat-form-field>

        <mat-form-field class="w-full">
          <mat-label>Resumen</mat-label>
          <textarea cdkTextareaAutosize cdkAutosizeMinRows="1" cdkAutosizeMaxRows="5" required matInput
            [(ngModel)]="piso.resumen"></textarea>
        </mat-form-field>

        <hr>

        <ng-container *ngFor="let video of piso.video; index as i">

          <h4>Vídeo {{i+1}}</h4>

          <button mat-button color="warn" (click)="deleteVideo(i)">Eliminar</button>

          <mat-form-field class="w-full">
            <mat-label>Descripción</mat-label>
            <input required matInput [(ngModel)]="video.descripcion">
          </mat-form-field>

          <mat-form-field class="w-full">
            <mat-label>Url</mat-label>
            <input required matInput [(ngModel)]="video.videoUrl">
            <a href="{{video.videoUrl}}" target="_blank" matSuffix>
              <mat-icon class="mr-2" matSuffix>open_in_new</mat-icon>
            </a>
          </mat-form-field>

        </ng-container>

        <hr>

        <div class="flex justify-content-center flex-wrap">
          <div class="flex flex-column	justify-content-center m-2">

            <button mat-stroked-button color="primary" (click)="showAddForm()">{{showForm? 'Cerrar formulario':'Añadir
              video'}}</button>

            <form *ngIf="showForm" [formGroup]="newVideo" (ngSubmit)="f.form.valid && addVideo(f)" #f="ngForm"
              class=" w-full">
              <h3 class="align-items-center m-2">Añadir video</h3>

              <mat-form-field class="w-full">
                <mat-label>Descripción</mat-label>
                <textarea cdkTextareaAutosize cdkAutosizeMinRows="1" cdkAutosizeMaxRows="5" required matInput
                  formControlName="nuevaDescripcion"></textarea>
              </mat-form-field>

              <mat-form-field class="w-full">
                <mat-label>Url</mat-label>
                <input required matInput formControlName="nuevaUrl">
              </mat-form-field>

              <br>

              <button mat-stroked-button type="submit" color="primary"
                [disabled]="false"><mat-icon>add</mat-icon></button>
              <button type="reset" mat-stroked-button color="accent">
                <mat-icon>restart_alt</mat-icon>
              </button>

            </form>

          </div>
        </div>


      </div>
    </mat-tab>




    <mat-tab label="Instrucciones">
      <!-- TODO: esto con mattable y formulario de añadir y borrar -->

      <div class=" m-5 ">

        <table mat-table [dataSource]="aparatos" class="mat-elevation-z8">

          <!-- Aparato Column -->
          <ng-container matColumnDef="aparato">
            <th mat-header-cell *matHeaderCellDef>Aparato</th>
            <td mat-cell *matCellDef="let element"> {{element.aparato}} </td>
          </ng-container>

          <!-- Descripcion Column -->
          <ng-container matColumnDef="descripcion">
            <th mat-header-cell *matHeaderCellDef>Descripción</th>
            <td mat-cell *matCellDef="let element"> {{element.descripcion}} </td>
          </ng-container>

          <!-- Videos Column -->
          <ng-container matColumnDef="video">
            <th mat-header-cell *matHeaderCellDef>Vídeo</th>
            <td mat-cell *matCellDef="let element">
              <ng-container *ngFor="let video of element.video">
                <a href="{{video}}" target="_blank">
                  <mat-icon>open_in_new</mat-icon>
                </a>
                &nbsp;
              </ng-container>
              </td>
          </ng-container>

          <!-- Image Column -->
          <ng-container matColumnDef="imagenes">
            <th mat-header-cell *matHeaderCellDef>Imagen</th>
            <td mat-cell *matCellDef="let element">
              <ng-container *ngFor="let imagen of element.imagenes" >
                <a href="{{imagen}}" target="_blank">
                  <mat-icon>open_in_new</mat-icon>
                </a>
                &nbsp;
              </ng-container>


            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions </th>
            <td mat-cell *matCellDef="let element">
              <!-- TODO: añadir feature editar pasando datos al formulario -->
              <!-- <button mat-button color="primary" (click)="editDirection(this.element)">Edit</button> | -->
              <button mat-button color="warn" (click)="deleteAparato(element)" >Delete</button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>
      </div>

      <div class="px-5 mb-5">

        <form [formGroup]="newDevice" (ngSubmit)="f.form.valid && setNewDevice(f)" #f="ngForm" class=" w-full">

          <mat-form-field>
            <mat-label>Nombre de Aparato</mat-label>
            <input required matInput formControlName="newAparato">

            <!-- <mat-error *ngIf="newPlaya.controls.idNuevo.hasError('pattern') ">
              <strong>Sin espacios</strong> ni cosas raras!
            </mat-error> -->

            <!-- <mat-error *ngIf="!newPlaya.controls.idNuevo.hasError('minLength') ">
              Mínimo <strong>4 caracteres!</strong>
            </mat-error> -->

          </mat-form-field>

          <mat-form-field>
            <mat-label>Descripción</mat-label>
            <input required matInput formControlName="newDescripcion">
          </mat-form-field>

          <mat-form-field>
            <mat-label>Video</mat-label>
            <input required matInput formControlName="newVideo">
          </mat-form-field>

          <mat-form-field>
            <mat-label>Imágenes</mat-label>
            <input required matInput formControlName="newImagenes">
          </mat-form-field>

          <br>

          <!-- <mat-form-field class="w-5">
            <mat-label>Descripción</mat-label>
            <textarea cdkTextareaAutosize cdkAutosizeMinRows="1" cdkAutosizeMaxRows="5" required matInput
              formControlName="descripcionNuevo"></textarea>
          </mat-form-field> -->

          <br>
          <button mat-stroked-button type="submit" color="primary" [disabled]="!newDevice.valid">
            <mat-icon>add</mat-icon>
          </button>
          <button type="reset" mat-stroked-button color="accent">
            <mat-icon>restart_alt</mat-icon>
          </button>

        </form>

      </div>

    </mat-tab>
  </mat-tab-group>



</ng-container>

<ng-template #elseTemplate>
  <shared-spinner></shared-spinner>
</ng-template>
