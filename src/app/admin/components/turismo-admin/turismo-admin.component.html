<ng-container *ngIf="turismo; else elseTemplate">


  <div class=" m-5 ">

    <table mat-table #gasolinerasTabla [dataSource]="turismo" class="mat-elevation-z8">

      <!-- Name Column -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let element"> {{element.nombre}}</td>
      </ng-container>

      <!-- Address Column -->
      <ng-container matColumnDef="direccion">
        <th mat-header-cell *matHeaderCellDef>Dirección</th>
        <td mat-cell *matCellDef="let element"> {{element.direccion}} </td>
      </ng-container>

      <!-- Poblacion Column -->
      <ng-container matColumnDef="link">
        <th mat-header-cell *matHeaderCellDef>Enlace</th>
        <td mat-cell *matCellDef="let element">
           <a href="{{element.link}}" target="_blank">
            <mat-icon>open_in_new</mat-icon>
          </a></td>
      </ng-container>
      <!-- Pais Column -->
      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let element"> {{element.descripcion}}</td>
      </ng-container>


      <!-- GPS Column -->
      <ng-container matColumnDef="gMaps">
        <th mat-header-cell *matHeaderCellDef>Google Maps</th>
        <td mat-cell *matCellDef="let element">
          <a href="{{element.gMaps}}" target="_blank">
            <mat-icon>open_in_new</mat-icon>
          </a>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions </th>
        <td mat-cell *matCellDef="let element">
          <!-- TODO: añadir feature editar pasando datos al formulario -->
          <!-- <button mat-button color="primary" (click)="editDirection(this.element)">Edit</button> | -->
          <button mat-button color="warn" (click)="deleteTurismo(this.element)">Delete</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>

    </table>
  </div>

  <div class="px-5 mb-5">

    <form [formGroup]="form" (ngSubmit)="f.form.valid && addTurismo(f)" #f="ngForm" class=" w-full">

      <mat-form-field>
        <mat-label>Nombre</mat-label>
        <input required matInput formControlName="nombre">
      </mat-form-field>
      <mat-form-field>
        <mat-label>Dirección</mat-label>
        <input required matInput formControlName="direccion">
      </mat-form-field>
      <mat-form-field>
        <mat-label>Enlace</mat-label>
        <input required matInput formControlName="link">
      </mat-form-field>


      <mat-form-field>
        <mat-label>Descripcion</mat-label>
        <textarea cdkTextareaAutosize cdkAutosizeMinRows="1" cdkAutosizeMaxRows="5" required matInput
          formControlName="descripcion"></textarea>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Enlace Google Maps</mat-label>
        <input required matInput formControlName="gMaps">
      </mat-form-field>

      <br>
      <button mat-stroked-button type="submit" color="primary" [disabled]="!form.valid">
        <mat-icon>add</mat-icon>
      </button>
      <button type="reset" mat-stroked-button color="accent">
        <mat-icon>restart_alt</mat-icon>
      </button>

    </form>

  </div>

</ng-container>

<ng-template #elseTemplate>
  <shared-spinner></shared-spinner>
</ng-template>
