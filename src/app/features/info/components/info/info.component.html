<ng-container *ngIf="info.length>0; else elseTemplate">
  <div class="grid m-3">

    <div *ngFor="let item of info" class="col-12 md:col-6">

      <div class="  align-items-center shadow-3 m-4">
        <div class="mb-2">
          <div>
            <a [routerLink]="['./', item.id]">
              {{item.id| titlecase }}
            </a>
          </div>
        </div>
      </div>
    </div>

  </div>
</ng-container>

<ng-template #elseTemplate>
  <shared-spinner></shared-spinner>
</ng-template>
